spring:
  application:
    name: interview-agent

server:
  # Render injects PORT; local dev falls back to 8080.
  port: ${PORT:8080}

app:
  cors:
    # Comma-separated list of allowed origins. FRONTEND_URL is set on Render.
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
  gemini:
    # Google AI Studio free tier — no credit card required. Generate the key at
    # https://aistudio.google.com and set it as GEMINI_API_KEY (never commit it).
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    max-tokens: 1024
    temperature: 0.7
  interview:
    # Hard minimums. Enforced in code (never left to the LLM to count).
    min-questions: 8
    min-days: 4
